# --- Couche data du dashboard CEO ---

# Compte Instagram Pro (Business/Creator) lie a une Page Facebook.
# Les identifiants/tokens sont dans .env (voir .env.example).
instagram:
  enabled: true
  top_reels_count: 5          # 3 a 5 meilleurs reels
  windows:                    # fenetres d'agregation (en jours)
    daily: 1
    weekly: 7
    monthly: 30

# Chaine YouTube a suivre (la tienne, pas les chaines analysees plus haut).
