# --- Couche data du dashboard CEO ---

# Compte Instagram Pro (Business/Creator) lie a une Page Facebook.
# Les identifiants/tokens sont dans .env (voir .env.example).
instagram:
  enabled: true
  top_reels_count: 5          # 3 a 5 meilleurs reels
  windows:                    # fenetres d'agregation (en jours)
    daily: 1
    weekly: 7
    monthly: 30

# Chaine YouTube a suivre (la tienne, pas les chaines analysees plus haut).
youtube_channel:
  enabled: true
  channel_id: ""              # renseigne channel_id OU handle
  handle: "@dralexisdelobaux"

# Source de l'app de closing (https://viral-intel-pipeline.vercel.app/dashboard).
# URL d'un CSV/JSON publie OU endpoint API. Laisser vide tant qu'indisponible.
closing_app:
  enabled: false
  data_url: ""
  format: "csv"               # "csv" ou "json"

# Publication des metriques vers Google Sheets (modele des 6 sheets du dashboard).
sheets:
  enabled: false              # true quand le service account est configure
  spreadsheet_id: ""
  worksheet: "social_metrics"

