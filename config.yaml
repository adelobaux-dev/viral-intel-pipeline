  enabled: true
  channel_id: ""              # renseigne channel_id OU handle
  handle: "@dralexisdelobaux"

# Sources de donnees metier (Google Sheets du dashboard / app de closing).
# Chaque source est lue en CSV. La feuille doit etre accessible :
#  - soit "Publiee sur le web" (Fichier > Partager > Publier sur le web), ou
#  - soit partagee "Tout le monde avec le lien : Lecteur".
# column_map traduit les colonnes reelles vers les KPIs internes
# (ex: "CA Paris": revenue_paris). A remplir une fois les colonnes connues.
